<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFTR Mutation Classes - Interactive Visualization</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }

        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 500ms;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Reliable Icon component: uses a ref to replace the element after mount/update
        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = useRef(null);

            useEffect(() => {
                if (ref.current && window.lucide) {
                    // Clear any previously injected SVG so lucide can re-create it
                    ref.current.innerHTML = '';
                    ref.current.setAttribute('data-lucide', name);
                    window.lucide.createIcons({ nodes: [ref.current] });
                }
            }, [name]);

            return (
                <span
                    ref={ref}
                    data-lucide={name}
                    className={className}
                    style={{ display: 'inline-flex', width: size, height: size }}
                />
            );
        };

        const mutationData = [
            {
                id: 'I',
                name: 'Class I',
                defect: 'Defective Synthesis',
                severity: 'Severe',
                location: 'Nucleus',
                mechanism: 'Nonsense or frameshift mutations create premature stop codons. The mRNA is destroyed by nonsense-mediated decay before the protein can even be built.',
                examples: 'G542X, R553X, W1282X',
                impact: 'Absence of CFTR protein.',
                color: 'bg-red-100 text-red-800 border-red-300',
                iconColor: 'text-red-600',
                organelleTarget: 'nucleus'
            },
            {
                id: 'II',
                name: 'Class II',
                defect: 'Defective Processing',
                severity: 'Severe',
                location: 'Endoplasmic Reticulum',
                mechanism: 'The protein is built but misfolded. Cellular quality control (chaperones) recognize the error, trap it in the ER, and send it to the proteasome for degradation.',
                examples: 'F508del (p.Phe508del) - Most common',
                impact: 'Protein degrades before reaching the cell surface.',
                color: 'bg-orange-100 text-orange-800 border-orange-300',
                iconColor: 'text-orange-600',
                organelleTarget: 'er'
            },
            {
                id: 'III',
                name: 'Class III',
                defect: 'Defective Regulation',
                severity: 'Severe',
                location: 'Plasma Membrane',
                mechanism: 'The protein reaches the cell surface, but the channel gate cannot open. It has impaired ATP binding at the Nucleotide Binding Domains (NBDs).',
                examples: 'G551D',
                impact: 'Channel is present but non-functional (gating defect).',
                color: 'bg-amber-100 text-amber-800 border-amber-300',
                iconColor: 'text-amber-600',
                organelleTarget: 'membrane'
            },
            {
                id: 'IV',
                name: 'Class IV',
                defect: 'Reduced Conductance',
                severity: 'Mild',
                location: 'Plasma Membrane',
                mechanism: 'The protein reaches the surface and opens, but the physical shape of the channel pore is altered, restricting the flow of chloride ions.',
                examples: 'R117H',
                impact: 'Reduced ion flow, leaving some preserved function.',
                color: 'bg-blue-100 text-blue-800 border-blue-300',
                iconColor: 'text-blue-600',
                organelleTarget: 'membrane'
            },
            {
                id: 'V',
                name: 'Class V',
                defect: 'Reduced Quantity',
                severity: 'Mild',
                location: 'Nucleus / Processing',
                mechanism: 'Impaired mRNA splicing results in the cell producing a severely reduced amount of otherwise normally functioning CFTR protein.',
                examples: '3849+10kbC->T',
                impact: 'Not enough functional protein at the surface.',
                color: 'bg-teal-100 text-teal-800 border-teal-300',
                iconColor: 'text-teal-600',
                organelleTarget: 'nucleus'
            },
            {
                id: 'VI',
                name: 'Class VI',
                defect: 'Reduced Stability',
                severity: 'Mild',
                location: 'Plasma Membrane',
                mechanism: 'Functional protein reaches the cell surface but is highly unstable and experiences accelerated degradation (it is removed from the membrane too quickly).',
                examples: 'c.120del23',
                impact: 'Decreased residence time at the cell surface.',
                color: 'bg-cyan-100 text-cyan-800 border-cyan-300',
                iconColor: 'text-cyan-600',
                organelleTarget: 'membrane'
            }
        ];

        function VisualPathway({ activeClassId }) {
            return (
                <div className="mb-10 p-6 bg-slate-900 rounded-xl shadow-inner relative overflow-hidden text-white border-2 border-slate-700">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-6 text-center z-10 relative">
                        Live Cellular Mechanics View
                    </h3>

                    <div className="flex flex-col md:flex-row h-auto md:h-64 relative z-10 w-full items-center justify-between px-4 gap-6 md:gap-0">
                        {/* Nucleus */}
                        <div className={`w-full md:w-1/4 h-full flex flex-col items-center justify-center relative ${['I', 'V'].includes(activeClassId) ? 'opacity-100 scale-105' : 'opacity-40'} transition-all`}>
                            <div className="w-24 h-24 md:w-32 md:h-32 rounded-full border-4 border-purple-500/50 bg-purple-900/50 flex items-center justify-center relative shadow-[0_0_30px_rgba(168,85,247,0.3)]">
                                <Icon name="dna" size={40} className="text-purple-300" />
                                {activeClassId === 'I' && (
                                    <div className="absolute -bottom-4 md:-bottom-6 bg-red-600 text-white text-[10px] md:text-xs font-bold px-2 py-1 rounded animate-pulse whitespace-nowrap shadow-lg z-20">
                                        STOP CODON (No mRNA)
                                    </div>
                                )}
                                {activeClassId === 'V' && (
                                    <div className="absolute -bottom-4 md:-bottom-6 bg-teal-600 text-white text-[10px] md:text-xs font-bold px-2 py-1 rounded whitespace-nowrap shadow-lg z-20">
                                        Splicing Defect (Less mRNA)
                                    </div>
                                )}
                            </div>
                            <span className="mt-4 text-xs md:text-sm font-bold text-purple-300 tracking-widest">NUCLEUS</span>
                        </div>

                        {/* Arrow 1 */}
                        <div className="hidden md:flex flex-1 justify-center items-center px-4">
                            <div className="h-1 w-full bg-slate-700 relative overflow-hidden rounded">
                                {activeClassId !== 'I' && (
                                    <div className="absolute top-0 left-0 h-full w-full bg-blue-400 animate-pulse"></div>
                                )}
                            </div>
                        </div>

                        {/* ER */}
                        <div className={`w-full md:w-1/4 h-full flex flex-col items-center justify-center relative ${activeClassId === 'II' ? 'opacity-100 scale-105' : 'opacity-40'} transition-all`}>
                            <div className="w-24 h-24 md:w-32 md:h-32 rounded-2xl border-4 border-orange-500/50 bg-orange-900/50 flex items-center justify-center relative shadow-[0_0_30px_rgba(249,115,22,0.3)]">
                                <div className="w-16 h-12 md:w-20 md:h-16 border-b-4 border-t-4 border-orange-400 rounded-full flex items-center justify-center">
                                    <div className="w-8 h-4 md:w-12 md:h-8 border-b-4 border-t-4 border-orange-300 rounded-full"></div>
                                </div>
                                {activeClassId === 'II' && (
                                    <div className="absolute -bottom-4 md:-bottom-6 bg-orange-600 text-white text-[10px] md:text-xs font-bold px-2 py-1 rounded animate-pulse whitespace-nowrap shadow-lg z-20">
                                        PROTEIN DEGRADED
                                    </div>
                                )}
                            </div>
                            <span className="mt-4 text-xs md:text-sm font-bold text-orange-300 tracking-widest">ER & GOLGI</span>
                        </div>

                        {/* Arrow 2 */}
                        <div className="hidden md:flex flex-1 justify-center items-center px-4">
                            <div className="h-1 w-full bg-slate-700 relative overflow-hidden rounded">
                                {!['I', 'II'].includes(activeClassId) && (
                                    <div className="absolute top-0 left-0 h-full w-full bg-blue-400 animate-pulse"></div>
                                )}
                            </div>
                        </div>

                        {/* Plasma Membrane */}
                        <div className={`w-full md:w-1/4 h-full flex flex-col items-center justify-center relative ${['III', 'IV', 'V', 'VI'].includes(activeClassId) ? 'opacity-100 scale-105' : 'opacity-40'} transition-all`}>
                            <div className="w-full md:w-24 h-24 md:h-48 border-t-4 border-b-4 md:border-t-0 md:border-b-0 md:border-l-4 md:border-r-4 border-cyan-400 bg-cyan-900/40 relative flex flex-row md:flex-col items-center justify-center gap-4 shadow-[0_0_30px_rgba(34,211,238,0.2)]">
                                {['I', 'II'].includes(activeClassId) ? (
                                    <div className="text-slate-400 text-xs text-center px-2 font-medium">No CFTR Reaches Membrane</div>
                                ) : (
                                    <>
                                        <div className={`w-12 h-12 md:w-16 md:h-12 bg-blue-500 rounded-md relative flex items-center justify-center shadow-lg transition-all ${activeClassId === 'VI' ? 'animate-bounce opacity-60 border-2 border-red-500 border-dashed' : ''} ${activeClassId === 'V' ? 'opacity-50 scale-75' : ''}`}>
                                            <div className={`w-2 h-full ${activeClassId === 'III' ? 'bg-red-400' : 'bg-cyan-100'} ${activeClassId === 'IV' ? 'w-[2px] bg-yellow-300' : ''}`}></div>
                                            {activeClassId === 'III' && <div className="absolute -left-2 md:-left-8 bg-red-600 text-[10px] px-1 rounded font-bold shadow">NO ATP</div>}
                                            {activeClassId === 'IV' && <div className="absolute -top-5 md:-top-6 bg-yellow-600 text-white text-[10px] px-1 rounded font-bold shadow whitespace-nowrap">NARROW</div>}
                                        </div>
                                        {activeClassId !== 'V' && (
                                            <div className={`w-12 h-12 md:w-16 md:h-12 bg-blue-500 rounded-md relative flex items-center justify-center shadow-lg transition-all ${activeClassId === 'VI' ? 'animate-pulse opacity-40 border-2 border-red-500 border-dashed' : ''}`}>
                                                <div className={`w-2 h-full ${activeClassId === 'III' ? 'bg-red-400' : 'bg-cyan-100'} ${activeClassId === 'IV' ? 'w-[2px] bg-yellow-300' : ''}`}></div>
                                            </div>
                                        )}
                                    </>
                                )}
                                {activeClassId === 'VI' && (
                                    <div className="absolute -bottom-4 md:-bottom-8 bg-cyan-700 text-white text-[10px] md:text-xs font-bold px-2 py-1 rounded whitespace-nowrap shadow-lg z-20">
                                        UNSTABLE / DEGRADING
                                    </div>
                                )}
                            </div>
                            <span className="mt-4 text-xs md:text-sm font-bold text-cyan-300 tracking-widest text-center">PLASMA MEMBRANE</span>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeClass, setActiveClass] = useState(mutationData[0]);

            return (
                <div className="min-h-screen bg-slate-100 p-4 md:p-8 font-sans text-slate-800">
                    <div className="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col">

                        {/* Header */}
                        <div className="bg-slate-800 text-white p-6 md:p-8">
                            <div className="flex items-center gap-3 mb-2">
                                <Icon name="dna" size={32} className="text-blue-400" />
                                <h1 className="text-2xl md:text-3xl font-bold">CFTR Mutation Classes</h1>
                            </div>
                            <p className="text-slate-300 max-w-3xl">
                                Interactive visualization of the six categories of Cystic Fibrosis Transmembrane Conductance Regulator (CFTR) defects, based on how they affect protein production, processing, and function.
                            </p>
                        </div>

                        <div className="flex flex-col lg:flex-row flex-grow">
                            {/* Sidebar Navigation */}
                            <div className="w-full lg:w-1/4 bg-slate-50 p-4 border-r border-slate-200">
                                <h2 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 px-2">Select a Class</h2>
                                <div className="flex flex-col gap-2">
                                    {mutationData.map((cls) => (
                                        <button
                                            key={cls.id}
                                            onClick={() => setActiveClass(cls)}
                                            className={`text-left px-4 py-3 rounded-lg font-medium transition-all duration-200 flex items-center justify-between border ${
                                                activeClass.id === cls.id
                                                    ? 'bg-blue-600 text-white border-blue-700 shadow-md'
                                                    : 'bg-white text-slate-700 border-slate-200 hover:border-blue-300 hover:bg-blue-50'
                                            }`}
                                        >
                                            <span className="flex items-center gap-2">
                                                <span className={`w-2 h-2 rounded-full ${cls.severity === 'Severe' ? 'bg-red-500' : 'bg-green-500'}`}></span>
                                                Class {cls.id}
                                            </span>
                                            <Icon name="arrow-right" size={16} className={activeClass.id === cls.id ? 'opacity-100' : 'opacity-0'} />
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-8 p-4 bg-white rounded-lg border border-slate-200 text-sm">
                                    <h3 className="font-bold text-slate-700 mb-2 flex items-center gap-2">
                                        <Icon name="info" size={16} className="text-blue-500" /> Legend
                                    </h3>
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className="w-3 h-3 rounded-full bg-red-500"></span>
                                        <span className="text-slate-600">Severe Phenotype (I - III)</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-full bg-green-500"></span>
                                        <span className="text-slate-600">Mild Phenotype (IV - VI)</span>
                                    </div>
                                </div>
                            </div>

                            {/* Main Content Area */}
                            <div className="w-full lg:w-3/4 p-6 md:p-8 flex flex-col">
                                <VisualPathway activeClassId={activeClass.id} />

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 flex-grow">
                                    <div className="flex flex-col gap-6">
                                        <div className={`p-6 rounded-xl border-2 ${activeClass.color} flex flex-col items-start gap-4`}>
                                            <div className="flex items-center justify-between w-full">
                                                <h2 className="text-3xl font-black">Class {activeClass.id}</h2>
                                                <span className="px-3 py-1 bg-white bg-opacity-50 rounded-full font-bold uppercase tracking-wider text-sm shadow-sm">
                                                    {activeClass.severity}
                                                </span>
                                            </div>
                                            <div>
                                                <h3 className="text-sm font-bold opacity-70 uppercase tracking-wider mb-1">Defect Type</h3>
                                                <p className="text-xl font-bold">{activeClass.defect}</p>
                                            </div>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex-grow">
                                            <div className="flex items-center gap-2 mb-3">
                                                <Icon name="activity" size={20} className="text-blue-500" />
                                                <h3 className="font-bold text-slate-700">Mechanism of Defect</h3>
                                            </div>
                                            <p className="text-slate-600 leading-relaxed">{activeClass.mechanism}</p>
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-6">
                                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                            <div className="flex items-center gap-2 mb-3">
                                                <Icon name="zap" size={20} className="text-blue-500" />
                                                <h3 className="font-bold text-slate-700">Functional Impact</h3>
                                            </div>
                                            <p className="text-slate-600 font-medium">{activeClass.impact}</p>
                                        </div>

                                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex-grow">
                                            <div className="flex items-center gap-2 mb-3">
                                                <Icon name="dna" size={20} className="text-blue-500" />
                                                <h3 className="font-bold text-slate-700">Representative Variants</h3>
                                            </div>
                                            <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-slate-800 font-mono font-bold">
                                                {activeClass.examples}
                                            </div>
                                            <p className="text-xs text-slate-400 mt-4 italic">
                                                Note: Exact manifestations can vary by individual and compounding mutations.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
